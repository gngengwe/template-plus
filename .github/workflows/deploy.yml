name: Deploy Vite to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OneDrive/Desktop/overlay/excel-template-editor/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: OneDrive/Desktop/overlay/excel-template-editor
      - name: Build
        run: npm run build
        working-directory: OneDrive/Desktop/overlay/excel-template-editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: OneDrive/Desktop/overlay/excel-template-editor/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4